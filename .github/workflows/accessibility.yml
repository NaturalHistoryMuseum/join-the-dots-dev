name: Accessibility Tests

on:
  # pull_request:
  push:
    # branches: [main, dev]
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        # Install python dependencies from project.toml
        run: cd server && pip install --no-cache-dir ./

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start Flask backend
        env:
          # Set testing environment variables
          CI: 'true'
          FLASK_ENV: testing
        run: |
          python -m server.run > flask.log 2>&1 &
          echo $! > flask.pid
          sleep 10
          echo "--- flask.log ---"
          cat flask.log
          if ! kill -0 $(cat flask.pid) 2>/dev/null; then
            echo "Flask process is not running"
            exit 1
          fi

      - name: Start frontend
        run: |
          npm run preview > frontend.log 2>&1 &
          echo $! > frontend.pid
          sleep 5
          echo "--- frontend.log ---"
          cat frontend.log
          if ! kill -0 $(cat frontend.pid) 2>/dev/null; then
            echo "Frontend process is not running"
            exit 1
          fi
        env:
          FRONTEND_PORT: 4173

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright accessibility tests
        run: npx playwright test
