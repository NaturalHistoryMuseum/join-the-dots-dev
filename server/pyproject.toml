[project]
name = "join-the-dots-dev"
version = "1.8.1"
description = "Join the Dots web application"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Natural History Museum", email = "data@nhm.ac.uk" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only"
]
dependencies = [
    "dotenv~=0.9.9",
    "flask~=2.2",
    "flask-cors~=5.0.0",
    "flask-dance~=7.1.0",
    "msal~=1.27.0",
    "mysql-connector-python~=8.0.33",
    "requests~=2.31.0",
    "flask_jwt_extended~=4.7.1",
    "gunicorn~=23.0.0",
    "flask-sqlalchemy~=3.1.1",
    "flask-marshmallow~=1.5.0",
    "marshmallow-sqlalchemy~=1.5.0",
    "pyjwt~=2.8",
    "pymysql~=1.1.0",
]


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
repository = "https://github.com/NaturalHistoryMuseum/join-the-dots-dev"
changelog = "https://github.com/NaturalHistoryMuseum/join-the-dots-dev/blob/main/CHANGELOG.md"

[tool]
[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "docs"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "D"
]
ignore = [
    "D100",
    "D104",
    "D200",
    "D202",
    "D203",
    "D205",
    "D206",
    "D212",
    "D300",
    "D401",
    "E111",
    "E114",
    "E117"
]

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88
pre-summary-newline = true
make-summary-multi-line = true
